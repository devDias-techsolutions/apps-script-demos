                'cli-002':{interactions:[{type:'ligação',text:'Cliente solicitou prazo para análise.',date:'2026-09-12',by:'Juliana Alves'}],tasks:[{title:'Retornar sobre proposta',date:'2026-09-18',done:false}],notes:'Decisor principal é Carlos Mendes.',nextAction:{type:'ligação',desc:'Retornar sobre proposta',date:'2026-09-18'},tags:['Prioridade Alta']}
              }
            };
            function load(){try{const s=JSON.parse(localStorage.getItem(KEY));return s||seed}catch(e){return seed}}
            let db=load();
            function save(){localStorage.setItem(KEY,JSON.stringify(db))}
            function ok(data,msg){return {ok:true,data:data===undefined?null:data,msg:msg||'Operação realizada com sucesso.'}}
            function err(msg){return {ok:false,msg}}
            function visibleClients(repId,isAdmin){return db.clientes.filter(c=>isAdmin||c.repId===repId)}
            function dashboard(repId,isAdmin){const cs=visibleClients(repId,isAdmin), props=db.propostas.filter(p=>isAdmin||p.repId===repId);const total=cs.length, cliente=cs.filter(c=>c.status==='Cliente').length, lead=cs.filter(c=>c.status==='Lead').length, captacao=cs.filter(c=>c.status==='Em captação').length, inativo=cs.filter(c=>c.status==='Inativo').length;const totalCLV=cs.reduce((a,c)=>a+(+c.clv||0),0);const abertas=props.filter(p=>['Enviada','Em análise'].includes(p.status));const ganhos=props.filter(p=>p.status==='Aceita');const perdidas=props.filter(p=>['Recusada','Cancelada'].includes(p.status));const valorAberto=abertas.reduce((a,p)=>a+(+p.valor||0),0);const stats={total,cliente,lead,captacao,inativo,totalCLV};const cs2={propostasEnviadas:props.filter(p=>p.status==='Enviada').length,propostasAnalise:props.filter(p=>p.status==='Em análise').length,propostasGanhas:ganhos.length,propostasPerdidas:perdidas.length,totalPropostas:props.length,valorPropTotal:props.reduce((a,p)=>a+(+p.valor||0),0),valorGanho:ganhos.reduce((a,p)=>a+(+p.valor||0),0),valorPerdido:perdidas.reduce((a,p)=>a+(+p.valor||0),0),valorAberto,ticketMedio:props.length?props.reduce((a,p)=>a+(+p.valor||0),0)/props.length:0,taxaGanho:props.length?(ganhos.length/props.length*100).toFixed(1):'0.0',opSaudaveis:Math.max(1,cliente),opAtencao:captacao,opCriticas:inativo};const priority=cs.filter(c=>c.status!=='Inativo').map(c=>({nome:c.nome,empresa:c.empresa,repNome:c.repNome,status:c.status,diasSemMov:Math.max(1,Math.floor((Date.now()-new Date(c.updatedAt).getTime())/86400000)),clv:c.clv,risco:(Date.now()-new Date(c.updatedAt).getTime())/86400000>30?'critico':(Date.now()-new Date(c.updatedAt).getTime())/86400000>15?'atencao':'ok'})).sort((a,b)=>b.diasSemMov-a.diasSemMov);const reps=db.reps.map(r=>{const mine=cs.filter(c=>c.repId===r.id), p=props.filter(x=>x.repId===r.id), won=p.filter(x=>x.status==='Aceita');return {nome:r.nome,clvTotal:mine.reduce((a,c)=>a+(+c.clv||0),0),totalClientes:mine.length,clientesAtivos:mine.filter(c=>c.status==='Cliente').length,leads:mine.filter(c=>c.status==='Lead').length,emCaptacao:mine.filter(c=>c.status==='Em captação').length,inativos:mine.filter(c=>c.status==='Inativo').length,estagnados:mine.filter(c=>c.status!=='Cliente'&&c.status!=='Inativo').length,criticos:mine.filter(c=>c.status==='Inativo').length,movimentacoes7d:mine.filter(c=>(Date.now()-new Date(c.updatedAt).getTime())<7*86400000).length,taxaConversao:p.length?(won.length/p.length*100).toFixed(1):'0.0',scoreOp:Math.min(100,50+mine.length*8)} });return ok({stats,recent:cs.slice(0,5),repsStats:reps,clientesStats:cs2,priorityList:priority.slice(0,8),insights:[{tipo:inativo?'atencao':'ok',icone:inativo?'⚠️':'🟢',texto:inativo?inativo+' cliente(s) inativo(s) precisam de acompanhamento.':'Carteira sem alertas críticos no momento.'}]})}
            function api(name,args){
              switch(name){
                case'autenticar':{const u=db.reps.find(r=>r.email===args[0]&&r.status==='ativo');return u?ok({id:u.id,nome:u.nome,email:u.email,cargo:u.cargo,telefone:u.telefone},'Login realizado com sucesso.'):err('E-mail ou senha incorretos.');}
                case'getDashboard':return dashboard(args[0],args[1]);
                case'getClientes':return ok(visibleClients(args[0],args[1]));
                case'getReps':return ok(db.reps);
                case'salvarRep':{const d=args[0];if(d.id){const i=db.reps.findIndex(r=>r.id===d.id);if(i<0)return err('Representante não encontrado.');db.reps[i]={...db.reps[i],nome:d.nome,email:d.email,telefone:d.telefone,status:d.status,cargo:d.cargo};}else{db.reps.push({...d,id:uid(),dataCadastro:now(),senha:undefined});}db.syslog.unshift({id:uid(),ts:now(),userName:'Administrador',acao:d.id?'UPDATE':'INSERT',tabela:'Representantes',registroId:d.id||'',campoAlterado:'dados',valorAntes:'',valorDepois:d.nome});save();return ok(null,d.id?'Representante atualizado com sucesso.':'Representante cadastrado.')}
                case'inativarRep':{const r=db.reps.find(x=>x.id===args[0]);if(!r)return err('Não encontrado.');r.status='inativo';db.syslog.unshift({id:uid(),ts:now(),userName:args[2]||'Administrador',acao:'INATIVAR',tabela:'Representantes',registroId:r.id,campoAlterado:'status',valorAntes:'ativo',valorDepois:'inativo'});save();return ok(null,'Representante inativado.')}
                case'salvarCliente':{const d=args[0];if(d.id){const i=db.clientes.findIndex(c=>c.id===d.id);if(i<0)return err('Cliente não encontrado.');db.clientes[i]={...db.clientes[i],...d,updatedAt:now()};}else{d.id=uid();d.dataCadastro=now();d.updatedAt=now();db.clientes.push(d)}db.syslog.unshift({id:uid(),ts:now(),userName:d._userName||'Administrador',acao:d.id?'UPDATE':'INSERT',tabela:'Clientes',registroId:d.id,campoAlterado:'dados',valorAntes:'',valorDepois:d.nome});save();return ok(null,d.id?'Cliente atualizado com sucesso.':'Cliente cadastrado.')}
                case'excluirCliente':{const c=db.clientes.find(x=>x.id===args[0]);if(!c)return err('Cliente não encontrado.');c.status='Inativo';c.updatedAt=now();save();return ok(null,'Cliente inativado.')}
                case'getClientDetail':return ok(db.details[args[0]]||{interactions:[],tasks:[],notes:'',nextAction:null,tags:[]});
                case'saveClientDetail':db.details[args[0]]=args[1];save();return ok(null,'Detalhes salvos.');
                case'inativarCliente':{const c=db.clientes.find(x=>x.id===args[0]);if(!c)return err('Cliente não encontrado.');c.status='Inativo';c.inativo_justificativa=args[1];c.inativo_auto='0';c.updatedAt=now();save();return ok(null,'Cliente inativado.')}
                case'justificarInativo':{const c=db.clientes.find(x=>x.id===args[0]);if(!c)return err('Cliente não encontrado.');c.inativo_justificativa=args[1];save();return ok(null,'Justificativa registrada.')}
                case'alterarSenha':return ok(null,'Senha alterada com sucesso.');
                case'getPropostas':return ok(db.propostas.filter(p=>args[1]||p.repId===args[0]));
                case'salvarProposta':{const d=args[0];if(d.id){const i=db.propostas.findIndex(p=>p.id===d.id);if(i<0)return err('Proposta não encontrada.');db.propostas[i]={...db.propostas[i],...d,updatedAt:now()};}else{d.id=uid();d.dataCriacao=now();d.updatedAt=now();db.propostas.push(d)}db.syslog.unshift({id:uid(),ts:now(),userName:d._userName||'Administrador',acao:d.id?'UPDATE':'INSERT',tabela:'Propostas',registroId:d.id,campoAlterado:'dados',valorAntes:'',valorDepois:d.descricao});save();return ok(null,d.id?'Proposta atualizada!':'Proposta registrada!')}
                case'cancelarProposta':{const p=db.propostas.find(x=>x.id===args[0]);if(!p)return err('Proposta não encontrada.');p.status='Cancelada';p.updatedAt=now();save();return ok(null,'Proposta cancelada.')}
                case'getSysLog':return ok(db.syslog.slice(0,Number(args[0])||500));
                case'consultarCNPJ':return ok({razao:'Empresa Demo Consultada Ltda.',empresa:'Empresa Demo Consultada',cnae:'Serviços empresariais',capital:'R$ 250.000,00',local:'Belo Horizonte - MG',porte:'Médio',situacao:'ATIVA',telefone:'(31) 3333-9999',email:'contato@empresa-demo.local'},'Consulta DEMO');
                case'excluirRep':{const r=db.reps.find(x=>x.id===args[0]);if(!r)return err('Representante não encontrado.');r.status='inativo';save();return ok(null,'Representante inativado.')}
                default:return ok(null);
              }
            }
            window.google=window.google||{};
            google.script={run:new Proxy({}, {get:function(_t,name){return function(){const args=[...arguments];const chain={withSuccessHandler:function(fn){chain._ok=fn;return chain},withFailureHandler:function(fn){chain._fail=fn;return chain}};setTimeout(function(){try{const r=api(name,args);if(chain._ok)chain._ok(r)}catch(e){if(chain._fail)chain._fail(e)}},80);return chain}})};
            window.seedDemoData=window.seedDemoData||function(){ };
            window.buscarCNPJ=window.buscarCNPJ||function(){ };
            try{sessionStorage.removeItem('nec_u')}catch(e){}
            const originalLogin=window.doLogin;
            window.doLogin=function(){
              const email=document.getElementById('lg-email').value.trim();
              if(!email){return originalLogin&&originalLogin()}
