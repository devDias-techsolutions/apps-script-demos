              S.user={id:u.id,nome:u.nome,email:u.email,cargo:u.cargo,telefone:u.telefone};
              sessionStorage.setItem('nec_u',JSON.stringify(S.user));showApp();navigate('dashboard');toast('success','Bem-vindo(a), '+u.nome.split(' ')[0]+'!','Login realizado no ambiente de demonstração.');
            };
            window.buscarCNPJ=function(){_demoCNPJ()};
            function _demoCNPJ(){setBtnLoading('btn-busca-cnpj',true,'<i data-lucide="search"></i>');setTimeout(function(){const d={razao:'Empresa Demonstração Ltda.',empresa:'Empresa Demonstração',cnae:'Serviços de tecnologia',capital:'R$ 180.000,00',local:'Belo Horizonte - MG',porte:'Médio',situacao:'ATIVA',telefone:'(31) 3333-0000',email:'contato@empresa-demo.local'};['c-emp','c-nome','c-email','c-tel'].forEach(function(id,i){const v=[d.empresa,d.razao,d.email,d.telefone][i];const e=document.getElementById(id);if(e&&!e.value)e.value=v});['c-cnpj-razao-social','c-cnpj-cnae-principal','c-cnpj-capital-social','c-cnpj-localidade','c-cnpj-porte','c-cnpj-situacao-cadastral'].forEach(function(id,i){const e=document.getElementById(id);if(e)e.value=[d.razao,d.cnae,d.capital,d.local,d.porte,d.situacao][i]});setBtnLoading('btn-busca-cnpj',false,'<i data-lucide="search"></i> Buscar');toast('success','CNPJ encontrado! (DEMO)','Dados fictícios preenchidos automaticamente.');renderIcons()},350)}
          })();
